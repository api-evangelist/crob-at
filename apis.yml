name: crob.at
description: >-
  Free, no-login web tool for sharing Pokémon Showdown teams as visual pages, with an anonymous keyless
  public REST API for creating and retrieving team links, generating usage-weighted random teams, and
  fetching Smogon sample teams and Pokémon type reference data. Publishes an OpenAPI 3.1 contract,
  APIs.json, an RFC 9727 api-catalog, llms.txt, and markdown twins of every team page for AI agents.
